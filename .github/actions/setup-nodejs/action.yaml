name: Setup Node JS
description: Setup Node JS
inputs:
  node-version:
    required: true
    type: string
  shell:
    required: true
    type: string
  folder:
    required: true
    type: string
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install dependencies
      run: |
        cd ${{ inputs.folder }}
        npm install
      shell: ${{ inputs.shell }}
    - name: Build project
      run: |
        cd ${{ inputs.folder }}
        npm run build
      shell: ${{ inputs.shell }}
