name: Fortify AST Workflow with Drupal for PHP Project Based
on:
  workflow_call:
    inputs:
    # Runner Params
      checkout-paths:
        required: false
        type: string
        default: ''
      runner-version: # Version: windows-2022|ubuntu-latest...
        required: false
        type: string
        default: ubuntu-latest
    # PHP Params
      php-version:
        required: false
        type: string
        default: "8.3"
    # Fortify AST params
      release-name:
        required: True
        type: string    
      sdlc-status:
        required: false
        type: string
        default: "Development"
      application-type:
        required: false
        type: string
        default: "Web"
      application-criticality:
        required: false
        type: string
        default: "Medium"
      entitlement-frequency:
        required: false
        type: string
        default: "Subscription"
      package-extra-opts:
        required: false
        type: string
        default: ""
jobs:
  fortify:
    runs-on: ${{ inputs.runner-version }}
    steps:
      - name: Check out Repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: ${{ inputs.checkout-paths }}
          sparse-checkout-cone-mode: false
      # Setup Drupal for PHP
      - name: Setup Drupal for PHP ${{ inputs.php-version }}
        uses: BeamSuntoryInc/FortifySastWorkflow/.github/actions/setup-drupal@main
        with:
          php-version: ${{ inputs.php-version }}
      # Run Fortify Scan
      - name: Run Core Application Security SAST/SCA Scans
        uses: BeamSuntoryInc/FortifySastWorkflow/.github/actions/setup-fod@main
        with:
          fod-url: ${{ vars.FOD_URL }}
          release-name: ${{ inputs.release-name }}
          sdlc-status: ${{ inputs.sdlc-status }}
          application-type: ${{ inputs.application-type }}
          application-criticality: ${{ inputs.application-criticality }}
          entitlement-frequency: ${{ inputs.entitlement-frequency }}
          entitlement-id: ${{ vars.FOD_ENTITLEMENT }}
          package-extra-opts: ${{ inputs.package-extra-opts }}
        env:
          FOD_CLIENT_ID: ${{ secrets.FOD_CLIENT_ID }}
          FOD_CLIENT_SECRET: ${{ secrets.FOD_CLIENT_SECRET }}
